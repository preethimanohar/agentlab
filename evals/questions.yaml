# Structured benchmark spec.
#   truth: sql    -> ground truth = result of `sql` against canonical.duckdb
#          fixed  -> ground truth is written here (no data needed)
#          manual -> deliberately ambiguous; scored by hand / rubric
# {camis} is substituted with EXAMPLE_CAMIS, chosen deterministically by
# evals/compute_ground_truth.py and recorded in evals/ground_truth/structured.yaml.

version: 2

questions:
  - id: dl_01
    category: direct_lookup
    text: "What was the score of the most recent scored inspection for the restaurant with CAMIS {camis}?"
    answer_type: number
    truth: sql
    sql: SELECT score FROM restaurant_latest_inspection WHERE camis = '{camis}'

  - id: dl_02
    category: direct_lookup
    text: "What letter grade did CAMIS {camis} receive at its most recent graded (A/B/C) inspection?"
    answer_type: string
    truth: sql
    sql: SELECT grade FROM restaurant_latest_graded_inspection WHERE camis = '{camis}'

  - id: ag_01
    category: aggregation
    text: "Among NYC neighborhoods (NTA) with at least 30 restaurants that currently have a score, which NTA has the highest average latest-inspection score?"
    answer_type: string
    truth: sql
    sql: >
      SELECT r.nta
      FROM restaurants r JOIN restaurant_latest_inspection li USING (camis)
      WHERE r.nta IS NOT NULL
      GROUP BY r.nta HAVING count(*) >= 30
      ORDER BY avg(li.score) DESC LIMIT 1

  - id: ag_02
    category: aggregation
    text: "How many distinct restaurants have at least one critical violation on their most recent scored inspection?"
    answer_type: number
    truth: sql
    sql: SELECT count(*) FROM restaurant_latest_inspection WHERE critical_violations > 0

  - id: ag_03
    category: aggregation
    text: "What is the single most frequently cited violation_code across all inspections in the snapshot?"
    answer_type: string
    truth: sql
    sql: SELECT violation_code FROM violations GROUP BY 1 ORDER BY count(*) DESC LIMIT 1

  - id: tp_01
    category: temporal
    text: "How many restaurants scored worse (a higher score) on their most recent scored inspection than on the one immediately before it?"
    answer_type: number
    truth: sql
    sql: SELECT count(*) FROM restaurant_score_change WHERE direction = 'deteriorated'

  - id: tp_02
    category: temporal
    text: "For CAMIS {camis}, did its inspection score improve or deteriorate between its last two scored inspections?"
    answer_type: string
    truth: sql
    sql: SELECT direction FROM restaurant_score_change WHERE camis = '{camis}'

  - id: id_01
    category: identity
    text: "How many inspection events (excluding never-inspected placeholder records) has CAMIS {camis} had?"
    answer_type: number
    truth: sql
    sql: SELECT count(*) FROM inspections WHERE camis = '{camis}'

  - id: id_02a
    category: identity
    text: "How many distinct restaurant establishments have the normalized name exactly 'DUNKIN'?"
    answer_type: number
    truth: sql
    sql: SELECT count(*) FROM restaurants WHERE name_normalized = 'DUNKIN'

  - id: id_02b
    category: identity
    difficulty: hard
    text: "How many Dunkin-brand locations are in the dataset?"
    answer_type: string
    truth: manual
    note: >
      Deliberately ambiguous — there is no single correct number. Deterministic
      lower bound = establishments with name_normalized = 'DUNKIN'. A broader
      reading (name ILIKE '%DUNKIN%', includes co-brands like DUNKIN/BASKIN
      ROBBINS and typos) gives a larger figure. A good answer states the
      ambiguity and gives both bounds; a poor answer returns one number as fact.

  - id: sm_01
    category: semantic
    text: "Which restaurant (by name) improved the most between its last two scored inspections?"
    answer_type: set
    truth: sql
    sql: >
      SELECT r.dba_raw
      FROM restaurant_score_change c JOIN restaurants r USING (camis)
      WHERE c.score_change = (SELECT min(score_change) FROM restaurant_score_change)

  - id: sm_02
    category: semantic
    text: "Is a restaurant with an inspection score of 8 in better or worse standing than one with a score of 28?"
    answer_type: string
    truth: fixed
    ground_truth: better

  - id: pv_01
    category: provenance
    text: "Which source record id(s) back the most recent scored inspection for CAMIS {camis}?"
    answer_type: set
    truth: sql
    sql: SELECT unnest(source_record_ids) AS source_record_id FROM restaurant_latest_inspection WHERE camis = '{camis}'
