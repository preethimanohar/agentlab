[project]
name = "agent-ready-data-lab"
version = "0.1.0"
description = "What changes when an AI agent becomes a consumer of a data product?"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=18.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pandera[polars]>=0.22",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
